name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    # One Postgres per run, started and destroyed with the job. Nothing else
    # points at it, so a run can build the schema from nothing and truncate
    # freely without reaching another run, a shared box, or production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transactional_email_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      TRANSACTIONAL_EMAIL_SERVICE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/transactional_email_service_test
      TRANSACTIONAL_EMAIL_SERVICE_API_KEY: test-api-key
      CLIENT_SERVICE_URL: http://localhost:9999
      CLIENT_SERVICE_API_KEY: fake-client-service-key
      EMAIL_GATEWAY_SERVICE_URL: http://localhost:9999
      EMAIL_GATEWAY_SERVICE_API_KEY: fake-email-gateway-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Generate OpenAPI spec
        run: npm run generate:openapi

      # The migration journal is what builds the schema — here and at boot in
      # production (src/index.ts calls migrate()). So schema.ts and the journal
      # have to agree: if schema.ts moved without a migration, drizzle-kit
      # writes one here and the working tree stops being clean.
      - name: Check schema.ts matches the migration journal
        run: |
          npx drizzle-kit generate --name ci_schema_drift_check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::schema.ts has changes with no matching migration. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle/
            exit 1
          fi

      - name: Run unit tests
        run: npm test

      # Builds the schema from the journal against the empty container database,
      # the same path the service takes on boot.
      - name: Run integration tests
        run: npm run test:integration
